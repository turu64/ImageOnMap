# ImageOnMap Economy Messages
# Users can copy this file to message_ja-JP.yml or other locales and translate the messages
# Set the locale in config.yml under 'economy.locale'

economy:
  # Error messages
  invalid-url: "{ce}Invalid image URL or unable to calculate map size."
  insufficient-funds: "{ce}You don't have enough money to create this map!"
  insufficient-funds-details: "{ce}Cost: {0}, Your balance: {1}"
  charge-failed: "{ce}Failed to charge your account. Map creation cancelled."
  inventory-full: "{ce}Your inventory is full! Use '/maptool getremaining' to get your map."

  # Confirmation dialog
  confirmation-title: "Map Creation Confirmation"
  map-size: "Map Size: "
  blocks: "{0} blocks ({1}×{2})"
  cost: "Cost: "
  balance: "Your Balance: "
  click-to-confirm: "Click to confirm: "
  confirm-button: "[CONFIRM]"
  confirm-hover: "Click to create the map"

  # Success messages
  charged: "{cs}Charged {0} for {1} map blocks."
  created: "{cs}Map created successfully!"

  # Update command
  update:
    insufficient-funds: "{ce}You don't have enough money to update this map!"
    insufficient-funds-details: "{ce}Cost: {0}, Your balance: {1}"
    charge-failed: "{ce}Failed to charge your account. Map update cancelled."
    charged: "{cs}Charged {0} for updating {1} map blocks."

  # Delete command
  delete:
    refunded: "{cs}Refunded {0} for {1} map blocks."
